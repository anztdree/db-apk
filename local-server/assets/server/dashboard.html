<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DB LOCAL · Dasbor</title>
<style>
  /* 0.5.3 — DASBOR SATU LAYAR (owner: "kebanyakan tab semua di pisahkan malah
     bikin kacau" + "log yg jelas rinci itu penting"):
     • SATU kolom log kronologis — alur login penuh tidak dipecah tab/grup.
     • Seksi REKAM DIHAPUS — CONFIG bukan rekam jejak.
     • Jalur [OFFLINE]/[ONLINE] terlihat jelas di kepala + garis config akar;
       bingkai log ikut warna jalur (hijau = OFFLINE manual, kuning = ONLINE).
     • Grup batch (req/404/pass) tetap ada sebagai Σ lipat di bawah — aktivitas
       per-file tidak membanjiri alur (kesepakatan 0.4.6).
     • Ikon + blok rincian ├─/└─ tampil penuh (0.4.9 — tidak dipangkas). */
  :root{
    --bg:#0c0a09; --card:#1c1917; --line:#292524; --tx:#fafaf9; --mut:#a8a29e;
    --det:#d6d3d1;
    --ok:#34d399; --warn:#fbbf24; --err:#f87171; --acc:#10b981; --acctx:#052e1a;
    --code:#111111;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--tx);
    font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header{
    padding:12px 14px 10px; border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    position:sticky; top:0; background:var(--bg); z-index:20;
  }
  header h1{font-size:16px; margin:0; font-weight:700}
  .badge{
    font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); color:var(--mut); letter-spacing:.4px;
  }
  .badge.mode-local{color:var(--ok); border-color:var(--ok)}
  .badge.mode-online{color:var(--warn); border-color:var(--warn)}
  .pill{
    margin-left:auto; font-size:12px; font-weight:800; padding:4px 12px; border-radius:999px;
    background:#7f1d1d33; color:var(--err); border:1px solid var(--line);
  }
  .pill.up{background:#064e3b33; color:var(--ok)}
  main{flex:1; padding:10px 14px 18px; max-width:960px; width:100%; margin:0 auto}

  /* 0.5.7 — LAPORAN owner "banyak teks sampah .. keterangan gak penting di header
     dan bottom biar apa": STRIP 6 keterangan, CFGLINE paragraf panjang, dan FOOTER
     legenda ikon DIHAPUS TOTAL — dasbor tinggal LOG capture (HttpCanary) + seksi
     CONFIG show/hide + grup Σ. Yang tersisa di kepala: judul + mode + status saja. */
  /* ---- baris upstream relay (di dalam seksi CONFIG — 0.5.7) ---- */
  .uprow{display:flex; gap:8px; align-items:center; padding:8px 12px;
    border-bottom:1px solid var(--line); background:var(--card)}
  .uprow .uplbl{font-size:12.5px; font-weight:700; color:var(--mut); flex:none}
  .uprow input{flex:1; min-width:0; background:var(--code); color:var(--tx);
    border:1px solid var(--line); border-radius:7px; padding:6px 9px;
    font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .uprow input:focus{outline:none; border-color:var(--acc)}
  .uprow .upstat{font-size:11px; color:var(--mut); flex:none; max-width:32%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* seksi CONFIG: isi config penuh (bedah field-per-field + teks) — SHOW/HIDE,
     KELUAR DARI FEED LOG (koreksi owner 0.5.4: "kalau isi config besar ya bisa show hide") */
  #cfgsec{margin:0 0 10px; border:1px solid var(--line); border-radius:10px; overflow:hidden}
  #cfgsec .cfghead{
    display:flex; gap:8px; align-items:center; padding:8px 12px; cursor:pointer;
    background:var(--card); font-weight:700; font-size:13px; user-select:none;
  }
  #cfgsec .cfghead .cnt{color:var(--mut); font-weight:400; font-size:12px; flex:1; text-align:right}
  #cfgsec .cfghead .arr{color:var(--mut)}
  #cfgsec .cfgbody{display:none; border-top:1px solid var(--line); background:var(--code)}
  #cfgsec.open .cfgbody{display:block}
  #cfgsec.open .cfghead .arr::before{content:"▾"}
  #cfgsec .cfghead .arr::before{content:"▸"}
  .cfitem{border-bottom:1px solid var(--line)}
  .cfitem:last-child{border-bottom:none}
  .cfhead{display:flex; gap:8px; align-items:baseline; padding:8px 12px; cursor:pointer; user-select:none}
  .cfhead:active{background:rgba(128,128,128,.08)}
  .cftitle{font-weight:700; font-size:12.5px}
  .cfsub{flex:1; min-width:0; color:var(--mut); font-size:11px; text-align:right;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cfarr{color:var(--mut); flex:none}
  .cfarr::before{content:"▸"}
  .cfitem.open .cfarr::before{content:"▾"}
  .cfbody{display:none; padding:2px 12px 10px; color:var(--det);
    font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere}
  .cfitem.open .cfbody{display:block}
  .cfempty{padding:10px 12px; color:var(--mut); font-size:12px}

  /* ---- toolbar & SATU kolom log kronologis ---- */
  .toolbar{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin:4px 0 8px}
  .chip{
    min-height:38px; padding:6px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--mut); font-weight:600; font-size:12.5px; cursor:pointer;
  }
  .chip.on{color:var(--tx); border-color:var(--ok)}
  .chip.tech.on{color:var(--warn); border-color:var(--warn)}
  button.act{
    min-height:38px; padding:6px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--card); color:var(--tx); font-weight:600; font-size:12.5px; cursor:pointer;
  }
  button.act:active{transform:translateY(1px)}
  #logbox{
    background:var(--code); border:1px solid var(--ok); border-radius:10px;
    font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    max-height:64vh; overflow-y:auto; word-break:break-word;
    -webkit-overflow-scrolling:touch;
  }
  #logbox.online{border-color:var(--warn)}

  /* 0.5.9 — BARIS SERAGAM RAPI (laporan owner: "log dan baris dropdown tidak
     sinkron tidak rapi"): grid 3 kolom [waktu][ikon][isi] — waktu mono tabular
     rata kanan, kolom ikon tetap, isi satu kolom mulai selalu di titik yang
     sama. Detail ├─/└─ (dulu polos selalu terbuka) + blok ISI (dulu jsonbox
     terpisah) digabung SATU dropdown rbox per baris — sejajar di kolom isi,
     gaya tampil tidak lagi campur antara teks polos dan kotak berbeda. */
  .logrow{display:grid; grid-template-columns:58px 26px 1fr; gap:0 8px;
    padding:4px 10px 5px; border-bottom:1px solid var(--line); align-items:start}
  .logrow:last-child{border-bottom:none}
  .logrow:hover{background:rgba(128,128,128,.08)}
  .logrow.tech{opacity:.62}
  .logtime{color:var(--mut); font-size:10.5px; line-height:1.8; text-align:right;
    font-variant-numeric:tabular-nums; letter-spacing:-.2px; white-space:nowrap}
  .logic{width:26px; text-align:center; font-size:13.5px; line-height:1.65}
  .logtext{min-width:0; font-size:12.5px; line-height:1.5; overflow-wrap:anywhere}
  .logrow.err .logtext{color:var(--err)}
  .logrow.ok .logtext{color:var(--ok)}
  .logempty{padding:12px 10px; color:var(--mut)}

  /* ---- 0.6.1 — SUB JUDUL JALUR per baris (owner: "sub judul pada log
     (Online / local) gk ada jelas bikin bingung" — timeline campur tetap
     SATU layar, kini tiap baris jelas lahir dari jalur mana). Badge kecil
     di depan kalimat; warna = badge kepala (hijau LOCAL manual, kuning
     ONLINE passthrough). Data "m" sudah ada di JSON sejak 0.5.4 — dulu
     renderRows membuangnya. ---- */
  .jtag{display:inline-block; font-size:9px; font-weight:800; letter-spacing:.6px;
    border:1px solid var(--line); border-radius:4px; padding:0 5px;
    margin-right:7px; line-height:1.6; vertical-align:1px; white-space:nowrap;
    user-select:none}
  .jtag.local{color:var(--ok); border-color:var(--ok)}
  .jtag.online{color:var(--warn); border-color:var(--warn)}

  /* ---- 0.5.9 dropdown RINCIAN tunggal per baris (detail pohon + ISI capture
     HttpCanary dalam SATU kotak — klik ▸ buka, sejajar kolom isi) ---- */
  details.rbox{margin-top:3px; border:1px solid var(--line); border-radius:7px;
    background:#131110; overflow:hidden; max-width:100%}
  details.rbox summary{cursor:pointer; padding:3px 8px; font-size:10.5px; font-weight:800;
    color:var(--acc); letter-spacing:.4px; user-select:none; list-style:none; min-height:24px;
    display:flex; align-items:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  details.rbox summary::-webkit-details-marker{display:none}
  details.rbox summary::before{content:"▸"; margin-right:6px; color:var(--acc); flex:none}
  details.rbox[open] summary::before{content:"▾"}
  details.rbox pre{margin:0; padding:6px 9px; font-size:11px; line-height:1.55;
    color:var(--det); max-height:260px; overflow:auto; white-space:pre-wrap;
    overflow-wrap:anywhere; word-break:break-word; border-top:1px dashed var(--line)}
  .logrow.err details.rbox summary{color:var(--err)}

  /* ---- grup batch: satu baris judul + statistik; diklik = rincian ---- */
  #grouphdr{
    margin:14px 2px 6px; font-size:11px; text-transform:uppercase; letter-spacing:1px;
    color:var(--mut); display:none;
  }
  #grouphdr.show{display:block}
  .grp{
    background:var(--code); border:1px solid var(--line); border-radius:10px;
    margin-bottom:7px; overflow:hidden;
  }
  .grphdr{
    display:flex; gap:9px; align-items:baseline; padding:9px 12px; cursor:pointer;
    font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; user-select:none;
  }
  .grphdr:active{background:rgba(128,128,128,.08)}
  .grparrow{flex:none; width:12px; color:var(--mut)}
  .grptitle{font-weight:700; flex:none}
  .grpstat{flex:1; min-width:0; color:var(--mut); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .grpstat .fail{color:var(--err); font-weight:700}
  .grpdur{flex:none; color:var(--mut); font-size:10.5px}
  .grpitems{
    display:none; border-top:1px solid var(--line);
    max-height:40vh; overflow-y:auto;
    font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .grp.open .grpitems{display:block}
  .grp.open .grparrow::before{content:"▾"}
  .grparrow::before{content:"▸"}
  .itrow{display:flex; gap:7px; padding:2px 12px; border-bottom:1px dashed var(--line)}
  .itrow:last-child{border-bottom:none}
  .ittime{color:var(--mut); flex:none; font-size:9.5px}
  .ittext{flex:1; min-width:0; word-break:break-word}
  .itrow.bad .ittext{color:var(--err)}
  .grempty{padding:8px 12px; color:var(--mut)}

</style>
</head>
<body>
<header>
  <h1>DB LOCAL</h1>
  <span class="badge" id="ver">v…</span>
  <span class="badge" id="modebadge">…</span>
  <span class="pill" id="pill">menyambung…</span>
</header>
<main>
  <!-- ===== seksi CONFIG: isi penuh show/hide + upstream relay (0.5.7) ===== -->
  <div id="cfgsec">
    <div class="cfghead" id="cfghead">
      <span>📦 CONFIG — isi penuh (show/hide)</span>
      <span class="cnt" id="cfgcnt"></span>
      <span class="arr"></span>
    </div>
    <div class="uprow">
      <span class="uplbl">upstream relay game</span>
      <input id="upin" type="text" placeholder="isian pemilik — opsional; kosong = MESIN GAME LOKAL (Play dijawab server ini)" spellcheck="false">
      <button class="act" id="upsave">Simpan</button>
      <span class="upstat" id="upstat"></span>
    </div>
    <div class="cfgbody" id="cfgbody"><div class="cfempty">memuat…</div></div>
  </div>

  <!-- ===== SATU kolom log kronologis (alur penuh, tidak dipecah) ===== -->
  <div class="toolbar">
    <button class="chip on" id="f-all">Semua</button>
    <button class="chip" id="f-warn">⚠ saja</button>
    <button class="chip tech" id="t-tech">RINCI</button>
    <button class="act" id="copylog">Copy</button>
    <button class="act" id="copyfull">Copy penuh</button>
    <button class="act" id="clearlog">Bersihkan</button>
    <button class="act" id="probegame">Tes game</button>
  </div>
  <div id="logbox">(memuat log…)</div>

  <!-- ===== grup batch Σ (lipat — aktivitas per-file tidak membanjiri alur) ===== -->
  <div id="grouphdr">Aktivitas batch — klik untuk rincian per-file</div>
  <div id="groups"></div>
</main>
<!-- 0.5.7 — footer legenda DIHAPUS (teks sampah bottom — laporan owner) -->

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var logSince = 0, logLoaded = false, filterWarn = false;
  var grpOpen = {};      // id grup -> true bila sedang dibuka
  var grpLast = null;    // snapshot JSON terakhir (hindari render ulang sia-sia)

  function fmtBytes(n){
    if(n < 0) return "?";
    if(n < 1024) return n + " B";
    if(n < 1048576) return (n/1024).toFixed(1).replace('.',',') + " KB";
    return (n/1048576).toFixed(1).replace('.',',') + " MB";
  }
  function fmtMs(ms){
    if(ms < 0) return "-";
    if(ms < 1000) return ms + " ms";
    return (ms/1000).toFixed(1).replace('.',',') + " dtk";
  }
  function fmtUptime(ms){
    if(ms <= 0) return "—";
    var s = Math.floor(ms/1000), m = Math.floor(s/60), h = Math.floor(m/60);
    if(h > 0) return h + " jam " + (m%60) + " mnt";
    if(m > 0) return m + " mnt " + (s%60) + " dtk";
    return s + " dtk";
  }
  // 0.5.7 — fmtUptime & strip status DIHAPUS (teks sampah — laporan owner);
  // fungsi fmtBytes tetap dipakai grup Σ & seksi CONFIG.
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  // ---------- status + SATU baris jalur config ----------
  function renderStatus(s){
    var sv = s.server || {};
    $("ver").textContent = "v" + (sv.version || "?");
    $("pill").textContent = sv.alive ? "HIDUP" : "MATI";
    $("pill").className = "pill" + (sv.alive ? " up" : "");
    var mode = String(sv.mode || "?");
    var offline = (mode === "local");
    var mb = $("modebadge");
    mb.textContent = offline ? "OFFLINE · config manual" : "ONLINE · jalur server asli";
    mb.className = "badge" + (offline ? " mode-local" : " mode-online");
    var lb = $("logbox");
    if(lb) lb.className = offline ? "" : "online";

    // 0.5.7 — strip 6 keterangan & cfgline paragraf DIHAPUS (laporan owner:
    // "keterangan gak penting di header dan bottom biar apa") — status inti
    // sudah cukup dari pill + badge mode; alur & config ada di log + seksi CONFIG.
    $("t-tech").classList.toggle("on", !!sv.logTech);
  }

  // ---------- seksi CONFIG (isi penuh, show/hide — 0.5.4) ----------
  var cfgOpen = false;
  function renderConfig(j){
    var list = (j && j.entries) ? j.entries : [];
    var box = $("cfgbody");
    $("cfgcnt").textContent = list.length ? (list.length + " berkas") : "(belum ada config disajikan)";
    if(!list.length){
      box.innerHTML = "<div class='cfempty'>belum ada config yang disajikan proses ini — "
        + "entri muncul otomatis saat game mengambil setting bin / serversetting / daftar server.</div>";
      return;
    }
    // render ulang hanya bila daftar berubah (sig = id + panjang body)
    var sig = list.map(function(e){ return e.id + ":" + (e.body||"").length; }).join("|");
    if(box.dataset.sig === sig) return;
    box.dataset.sig = sig;
    box.innerHTML = list.map(function(e){
      var open = e._open ? " open" : "";
      return "<div class='cfitem' data-c='" + esc(e.id) + "'>"
        + "<div class='cfhead'><span class='cfarr'></span>"
        + "<span class='cftitle'>" + esc(e.title) + "</span>"
        + "<span class='cfsub'>" + esc(e.sub) + "</span></div>"
        + "<div class='cfbody'>" + esc(e.body || "(kosong)") + "</div></div>";
    }).join("");
    // pertahankan status buka per id
    Array.prototype.forEach.call(box.querySelectorAll(".cfitem"), function(n){
      if(cfgItemOpen[n.dataset.c]) n.classList.add("open");
    });
  }
  var cfgItemOpen = {};
  $("cfghead").addEventListener("click", function(){
    cfgOpen = !cfgOpen;
    $("cfgsec").classList.toggle("open", cfgOpen);
    pollConfig();
  });
  $("cfgbody").addEventListener("click", function(ev){
    var h = ev.target.closest(".cfhead");
    if(!h) return;
    var it = h.parentElement;
    var id = it.dataset.c;
    cfgItemOpen[id] = !cfgItemOpen[id];
    it.classList.toggle("open", cfgItemOpen[id]);
  });
  function pollConfig(){
    fetch("/api/config").then(function(r){ return r.json(); }).then(renderConfig).catch(function(){});
  }

  // ---------- 0.5.7 — upstream relay game (di seksi CONFIG) ----------
  // REBUILD 0.0.1: LOCAL punya MESIN GAME LOKAL (GameEngine) — Play dijawab
  // server ini sendiri (kontrak dari kode klien, nilai dari dragonball.db).
  // Isian upstream = OPSI relay pilihan pemilik (tersimpan config/
  // game-upstream.txt, aktif tanpa restart). Paket manual tidak pernah
  // membawa tujuan (dulu terisi alamat server asli mentah = pelanggaran;
  // owner: online cuma jejak arah, bukan sumber nilai).
  function pollUpstream(){
    fetch("/api/upstream").then(function(r){ return r.json(); }).then(function(j){
      var inp = $("upin");
      if(document.activeElement !== inp && inp.value === "") inp.value = j.url || "";
      $("upstat").textContent = j.url ? ("aktif — " + (j.sumber || "")) : (j.sumber || "");
    }).catch(function(){});
  }
  $("upsave").addEventListener("click", function(){
    var b = $("upsave");
    b.textContent = "menyimpan…";
    fetch("/api/upstream", {method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"url=" + encodeURIComponent($("upin").value.trim())})
      .then(function(r){ return r.json(); })
      .then(function(j){
        b.textContent = "Simpan";
        $("upstat").textContent = j.ok ? ("tersimpan — " + j.url) : ("gagal — " + (j.error || "?"));
        if(j.ok) pollConfig();
      }).catch(function(){
        b.textContent = "Simpan";
        $("upstat").textContent = "gagal — dasbor tidak merespons";
      });
  });

  function pollStatus(){
    fetch("/api/status").then(function(r){ return r.json(); }).then(renderStatus).catch(function(){
      $("pill").textContent = "PUTUS";
      $("pill").className = "pill";
    });
  }

  // ---------- SATU kolom log (alur penting, blok rincian penuh) ----------
  function treeify(detail){
    var lines = String(detail).split(/\n/);
    var out = "";
    for(var i=0;i<lines.length;i++){
      if(lines[i].length === 0 && i === lines.length-1) continue;
      out += (i < lines.length-1 ? "├─ " : "└─ ") + lines[i] + (i < lines.length-1 ? "\n" : "");
    }
    return out;
  }
  function iconClass(icon){
    var c = String(icon || "");
    if(c.indexOf("⚠") === 0 || c.indexOf("❌") === 0) return " err";
    if(c.indexOf("✅") === 0 || c.indexOf("🚀") === 0) return " ok";
    return "";
  }
  function renderRows(arr){
    var box = $("logbox");
    if(!arr.length) return;
    var atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    var frag = document.createDocumentFragment();
    arr.forEach(function(e){
      logSince = Math.max(logSince, e.id);
      var tech = e.v === 1;
      var row = document.createElement("div");
      row.className = "logrow" + (tech ? " tech" : "") + iconClass(e.icon);
      row.dataset.warn = (String(e.icon || "").indexOf("⚠") === 0 || String(e.icon || "").indexOf("❌") === 0) ? "1" : "0";
      // data mentah disimpan di dataset supaya Copy menghasilkan format yang
      // sama persis dengan human.log: "09:40:34 ✅ Login game sukses…" + blok ├─/└─
      row.dataset.time = e.t || "";
      row.dataset.icon = tech ? "·" : (e.icon || "");
      row.dataset.text = e.text || "";
      row.dataset.detail = e.detail || "";
      row.dataset.isiLabel = e.isiLabel || ""; // 0.5.6 — capture isi
      row.dataset.isi = e.isi || "";
      row.dataset.m = e.m || ""; // 0.6.1 — tag jalur baris (badge + Jalur di rincian + Copy)
      var tm = document.createElement("span"); tm.className = "logtime"; tm.textContent = e.t;
      var ic = document.createElement("span"); ic.className = "logic"; ic.textContent = tech ? "·" : e.icon;
      var tx = document.createElement("span"); tx.className = "logtext";
      // 0.6.1 — sub judul jalur per baris: badge [LOCAL]/[ONLINE] di depan kalimat
      // (field "m" dari server — timeline campur tetap satu layar, jalur kini jelas)
      var jm = String(e.m || "").toLowerCase();
      if(jm === "local" || jm === "online"){
        var jtd = document.createElement("span");
        jtd.className = "jtag " + jm;
        jtd.textContent = jm.toUpperCase();
        tx.appendChild(jtd);
      }
      tx.appendChild(document.createTextNode(e.text || ""));
      // 0.5.9 — SATU dropdown rincian per baris: detail pohon ├─/└─ + ISI capture
      // digabung dalam SATU kotak (dulu detail polos + jsonbox terpisah = baris
      // dan dropdown tidak sinkron/tidak rapi). Status buka tetap pada node DOM
      // — baris lama tidak dirender ulang, jadi pilihan ▸ pemain tidak reset.
      var hasDet = !!(e.detail && String(e.detail).length);
      var hasIsi = !!(e.isi && String(e.isi).length);
      if(hasDet || hasIsi){
        var jb = document.createElement("details"); jb.className = "rbox";
        var lbl = hasDet ? (hasIsi ? "rincian · ISI" : "rincian") : (e.isiLabel || "ISI");
        var sm = document.createElement("summary"); sm.textContent = lbl;
        var pr = document.createElement("pre");
        // 0.6.1 — baris PERTAMA rincian = jalur baris ini (owner: sub judul harus jelas)
        var body = "";
        if(jm === "local" || jm === "online"){
          body += "Jalur : " + (jm === "local"
            ? "LOCAL — config manual (paket offline)"
            : "ONLINE — passthrough ke server asli") + "\n";
        }
        if(hasDet) body += treeify(e.detail);
        if(hasIsi){
          if(body) body += "\n";
          body += "▸ " + (e.isiLabel || "ISI") + "\n" + e.isi;
        }
        pr.textContent = body;
        jb.appendChild(sm); jb.appendChild(pr);
        tx.appendChild(jb);
      }
      row.appendChild(tm); row.appendChild(ic); row.appendChild(tx);
      frag.appendChild(row);
    });
    box.appendChild(frag);
    while(box.childNodes.length > 1200) box.removeChild(box.firstChild);
    if(atEnd) box.scrollTop = box.scrollHeight;
  }
  function pollLog(){
    fetch("/api/logs?since=" + logSince).then(function(r){ return r.json(); }).then(function(j){
      var box = $("logbox");
      if(!logLoaded){
        logLoaded = true;
        box.textContent = "";
      }
      // 0.5.8 — lastId mundur = proses server RESTART (force close/switch mode):
      // dulu since tinggi milik proses lama menyaring habis semua baris proses
      // baru (id mulai 1 lagi) → feed tampak mati ("log diem"). Kini feed
      // dimuat ulang dari awal proses yang hidup.
      if(j.lastId < logSince){
        logSince = 0;
        box.textContent = "";
        grpLast = null;
        pollLog();
        return;
      }
      renderRows(j.rows || []);
    }).catch(function(){
      if(!logLoaded){
        var b = $("logbox"); b.textContent = "";
        var d = document.createElement("div"); d.className = "logempty";
        d.textContent = "gagal memuat log — coba muat ulang halaman";
        b.appendChild(d);
      }
    });
  }
  function applyWarnFilter(){
    document.querySelectorAll("#logbox [data-warn]").forEach(function(n){
      n.style.display = (filterWarn && n.dataset.warn === "0") ? "none" : "";
    });
    $("f-all").classList.toggle("on", !filterWarn);
    $("f-warn").classList.toggle("on", filterWarn);
  }
  $("f-all").addEventListener("click", function(){ filterWarn = false; applyWarnFilter(); });
  $("f-warn").addEventListener("click", function(){ filterWarn = true; applyWarnFilter(); });

  $("t-tech").addEventListener("click", function(){
    var next = !$("t-tech").classList.contains("on");
    fetch("/api/logtech?on=" + (next ? "1" : "0")).then(function(){ pollStatus(); }).catch(function(){});
  });

  // ---------- grup batch (judul = statistik hidup; diklik = rincian) ----------
  function grpStatLine(g){
    var t = g.count + " " + g.unit;
    if(g.bytes > 0) t += " · " + fmtBytes(g.bytes);
    t += g.fail > 0 ? " · <span class='fail'>" + g.fail + " gagal</span>" : " · 0 gagal";
    return t;
  }
  function renderGroups(j){
    var list = (j && j.groups) ? j.groups : [];
    var hdr = $("grouphdr"), box = $("groups");
    if(!list.length){
      hdr.className = "";
      box.innerHTML = "";
      grpLast = null;
      return;
    }
    hdr.className = "show";
    var sig = list.map(function(g){ return g.id + ":" + g.count + ":" + g.fail; }).join("|");
    var itemsChanged = false;
    list.forEach(function(g){
      var sigIt = g.items.length + ":" + (g.items.length ? g.items[g.items.length-1][1] : "");
      if(!grpLast || grpLast.map[g.id] !== sigIt) itemsChanged = true;
    });
    if(!box.childElementCount || !grpLast || grpLast.sig !== sig || itemsChanged){
      box.innerHTML = list.map(function(g){
        var open = !!grpOpen[g.id];
        var items = open ? g.items : [];
        return "<div class='grp" + (open ? " open" : "") + "' data-g='" + esc(g.id) + "'>"
          + "<div class='grphdr'>"
          +   "<span class='grparrow'></span>"
          +   "<span class='grptitle'>" + esc(g.title) + "</span>"
          +   "<span class='grpstat'>" + grpStatLine(g) + "</span>"
          +   "<span class='grpdur'>" + (g.durMs > 0 ? fmtMs(g.durMs) : "") + "</span>"
          + "</div>"
          + "<div class='grpitems'>"
          +   (items.length
                ? items.map(function(it){
                    return "<div class='itrow" + (it[2] ? "" : " bad") + "'>"
                      + "<span class='ittime'>" + esc(it[0]) + "</span>"
                      + "<span class='ittext'>" + esc(it[1]) + "</span></div>";
                  }).join("")
                : "<div class='grempty'>buka untuk melihat " + (g.count + g.fail) + " item…</div>")
          + "</div>"
          + "</div>";
      }).join("");
    } else {
      list.forEach(function(g){
        var el = box.querySelector(".grp[data-g='" + g.id + "'] .grpstat");
        if(el) el.innerHTML = grpStatLine(g);
      });
    }
    grpLast = { sig: sig, map: (function(){
      var m = {};
      list.forEach(function(g){
        m[g.id] = g.items.length + ":" + (g.items.length ? g.items[g.items.length-1][1] : "");
      });
      return m;
    })() };
  }
  function pollGroups(){
    fetch("/api/groups").then(function(r){ return r.json(); }).then(renderGroups).catch(function(){});
  }
  $("groups").addEventListener("click", function(ev){
    var hdr = ev.target.closest(".grphdr");
    if(!hdr) return;
    var wrap = hdr.parentElement, id = wrap.dataset.g;
    grpOpen[id] = !grpOpen[id];
    wrap.classList.toggle("open", grpOpen[id]);
    pollGroups();
  });

  // ---------- tombol ----------
  function copyText(txt, btn, label){
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function(){
      btn.textContent = "Tersalin ✓";
      setTimeout(function(){ btn.textContent = label; }, 1500);
    }).catch(function(){
      var ta = document.createElement("textarea");
      ta.value = txt; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
      btn.textContent = "Tersalin ✓";
      setTimeout(function(){ btn.textContent = label; }, 1500);
    });
  }
  // Copy = cerita utk ditempel — format rapi & RINCIAN PENUH (0.4.9):
  //   alur   : "09:40:34 ✅ Login game sukses — akun lama"
  //   detail : blok pohon ├─/└─ tiap baris (TIDAK digabung/dipangkas)
  //   grup Σ : "09:41:20 Σ Request game — 105 file · 2,4 MB · 0 gagal (3,9 dtk)"
  function copyRow(n){
    if(!n.dataset || n.dataset.text === undefined) return n.textContent || "";
    // 0.6.1 — Copy ikut format human.log: [ICON|JALUR] (owner: sub judul jalur
    // jelas — hasil Copy harus sama persis dengan txt di disk)
    var jm = String(n.dataset.m || "").toUpperCase();
    if(jm !== "LOCAL" && jm !== "ONLINE") jm = "";
    var line = n.dataset.time + " [" + (n.dataset.icon || "·") + (jm ? "|" + jm : "") + "] "
      + (n.dataset.text || "");
    if(n.dataset.detail){
      var dl = String(n.dataset.detail).split(/\n/);
      for(var i=0;i<dl.length;i++){
        if(dl[i].length === 0 && i === dl.length-1) continue;
        line += "\n    " + (i < dl.length-1 ? "├─ " : "└─ ") + dl[i];
      }
    }
    // 0.5.6 — capture isi ikut di Copy (bukti penuh, sama dengan human.log)
    // 0.5.9 — "▸ " + label: label sudah berawalan "ISI · …" (dulu dobel "ISI · ISI")
    if(n.dataset.isi){
      line += "\n    ▸ " + (n.dataset.isiLabel || "ISI");
      var il = String(n.dataset.isi).split(/\n/);
      for(var j=0;j<il.length;j++){
        line += "\n       " + il[j];
      }
    }
    return line;
  }
  $("copylog").addEventListener("click", function(){
    var now = new Date();
    var hh = function(x){ return (x < 10 ? "0" : "") + x; };
    var ts = hh(now.getHours()) + ":" + hh(now.getMinutes()) + ":" + hh(now.getSeconds());
    var lines = Array.prototype.map.call($("logbox").childNodes, copyRow);
    document.querySelectorAll("#groups .grp").forEach(function(g){
      var title = g.querySelector(".grptitle").textContent;
      var stat = g.querySelector(".grpstat").textContent;
      var dur = g.querySelector(".grpdur").textContent;
      lines.push(ts + " Σ " + title + " — " + stat.replace(/\s+/g," ").trim()
        + (dur ? " (" + dur + ")" : "") + " — rincian di dasbor");
    });
    copyText(lines.join("\n"), $("copylog"), "Copy");
  });
  // Copy penuh = ekor human.log dari disk (termasuk ringkasan Σ + baris teknis)
  $("copyfull").addEventListener("click", function(){
    fetch("/api/logs/file?tail=400").then(function(r){ return r.text(); }).then(function(t){
      copyText(t, $("copyfull"), "Copy penuh");
    }).catch(function(){
      $("copyfull").textContent = "gagal";
      setTimeout(function(){ $("copyfull").textContent = "Copy penuh"; }, 1500);
    });
  });
  $("clearlog").addEventListener("click", function(){
    fetch("/api/logs/clear").then(function(){
      $("logbox").textContent = "";
      $("groups").innerHTML = "";
      $("grouphdr").className = "";
      logSince = 0;
      grpOpen = {};
      grpLast = null;
    }).catch(function(){});
  });
  // 0.5.4 — Tes game: uji upstream server game (LOCAL) — hasilnya muncul di
  // feed log (📡/⚠️ dari Monitor.probeGameServers)
  $("probegame").addEventListener("click", function(){
    var b = $("probegame");
    b.textContent = "menguji…";
    fetch("/api/probe/game").then(function(r){ return r.json(); }).then(function(j){
      b.textContent = "Tes game";
    }).catch(function(){ b.textContent = "Tes game"; });
  });

  pollStatus();
  pollLog();
  pollGroups();
  pollConfig();
  pollUpstream();
  setInterval(pollStatus, 3000);
  setInterval(pollLog, 2000);
  setInterval(pollGroups, 3000);
  setInterval(pollConfig, 5000);
  setInterval(pollUpstream, 5000);
})();
</script>
</body>
